# Supabase DB 백업: 로컬에 pg_dump 가 없어도 postgres 이미지의 것을 쓴다
# 실행 (저장소 루트에서): docker compose --env-file .env -f docker/backup/compose.yml run --rm backup
# pg_dump 는 서버보다 같거나 높은 메이저여야 한다. 대시보드 > Settings > Infrastructure 의 Postgres 버전보다 낮으면 태그를 올린다
services:
  backup:
    image: postgres:17-alpine
    environment:                  # .env 전체가 아니라 백업에 필요한 값만 넘긴다
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?.env 에 SUPABASE_DB_URL 을 넣어 주세요}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Seoul              # 파일 이름 시각을 한국 시간으로
    volumes:
      - ../../backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
